# The gate on every push and pull request: one job per app, each running that app's own check.
#
# `admin` is what `npm run check` runs, in the order that fails fastest: the architecture
# boundaries (a grep, instant), the typecheck and build (which covers the specs too), then the
# test suite. `app` is the Flutter app's check from frontend/mobile/.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy.yml, so nothing reaches the server without passing it.
  workflow_call:

jobs:
  admin:
    runs-on: ubuntu-latest
    # The workspace root, with the lockfile, is frontend/.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The workspace root (frontend/) owns the lockfile; packages resolve to source, so this is the
      # only install the repository needs.
      - run: npm ci

      - name: Architecture boundaries
        run: npm run lint:arch

      - name: Typecheck and build
        run: npm run build

      - name: Tests
        run: npm run test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v5

      # The same version frontend/mobile/Dockerfile builds the deployed app with.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Architecture boundaries
        run: dart run tool/check_architecture.dart

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
