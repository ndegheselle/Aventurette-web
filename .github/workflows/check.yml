# The gate the repository's own `npm run check` runs, on every push and pull request.
#
# Three steps, in the order that fails fastest: the architecture boundaries (a grep, instant),
# the typecheck and build (which covers the specs too), then the test suite.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The workspace root owns the lockfile; packages resolve to source, so this is the
      # only install the repository needs.
      - run: npm ci

      - name: Architecture boundaries
        run: npm run lint:arch

      - name: Typecheck and build
        run: npm run build

      - name: Tests
        run: npm run test
