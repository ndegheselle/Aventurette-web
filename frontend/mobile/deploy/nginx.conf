# Serves the Flutter web build inside the app image.
# TLS and the API proxy are handled by the separate nginx service (see backend/nginx/).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a single-page app: an unknown path returns the app shell, and the router
    # takes it from there.
    location / {
        try_files $uri $uri/ /index.html;

        # main.dart.js, flutter_bootstrap.js and the service worker keep the same names from one
        # build to the next, so a browser must revalidate them or it keeps running the old app
        # after a deploy. Revalidation is a 304 when nothing changed.
        add_header Cache-Control "no-cache";
    }
}
