name: aventurette
description: "Aventurette, the Flutter app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_widget_from_html_core: ^0.17.4
  go_router: ^18.0.2
  lucide_icons_flutter: ^3.1.24
  pocketbase: ^0.25.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Every locales/ folder is picked up by I18n at startup: list a new one here.
  assets:
    - lib/app/locales/
    - lib/ui/locales/
    - lib/features/activities/locales/
    - lib/features/dashboard/locales/
    - lib/features/user/locales/
