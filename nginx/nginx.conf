events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The base image symlinks both of these to the container's stdout/stderr,
    # so `docker compose logs nginx` shows them.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # The JS bundle and the JSON API responses are the bulk of what goes over the wire.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Do not advertise the exact nginx version.
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
