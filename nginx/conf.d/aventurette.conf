# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name aventurette.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name aventurette.fr;

    ssl_certificate /etc/letsencrypt/live/aventurette.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aventurette.fr/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # API → PocketBase
    location /api/ {
        proxy_pass http://api:3000/;  # IMPORTANT: trailing slash

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Needed for websockets (PocketBase uses them)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}