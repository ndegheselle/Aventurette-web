# Production stack for a single host. See DEPLOYMENT.md for the full procedure.
#
# Five containers on one internal network. Only nginx publishes ports; app, admin and api are
# reachable by service name from inside the network and from nowhere else.
#
# Everything site-specific comes from the .env file next to this one — the domains are set
# there once and reach nginx, the certificate and both bundles from that single place.
name: aventurette

services:
    # The edge: TLS termination, the ACME challenge, and routing by hostname.
    nginx:
        build:
            context: . # backend/
            dockerfile: nginx/Dockerfile
        container_name: aventurette-nginx
        ports:
            - '80:80'
            - '443:443'
        environment:
            # Substituted into nginx/templates/*.template on start, and used by the
            # entrypoint to find /etc/letsencrypt/live/$DOMAIN.
            DOMAIN: ${DOMAIN:?set DOMAIN in .env, see .env.example}
            APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env, see .env.example}
            ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env, see .env.example}
            API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, see .env.example}
        volumes:
            - ./nginx/certbot/www:/var/www/certbot
            - ./nginx/certbot/conf:/etc/letsencrypt
        # No `command:` override on purpose. The base image's entrypoint only runs the
        # scripts in /docker-entrypoint.d/ when the command starts with `nginx`, and those
        # scripts are what render the vhosts, gate HTTPS on the certificate, and start the
        # reload loop that picks renewals up.

        # Started, not healthy: the edge must come up even when the API does not, or a
        # broken api container would also take down the ACME challenge on port 80.
        depends_on:
            - app
            - admin
            - api
        restart: unless-stopped

    # The clients' Flutter app, built for the web and served by its own nginx
    # (frontend/mobile/deploy/nginx.conf owns the SPA fallback).
    app:
        build:
            context: ../frontend/mobile # self-contained: it depends on nothing outside its folder
            args:
                # Compiled into the bundle with --dart-define, so it is a build input, not a
                # runtime one: changing the domain needs `docker compose up -d --build app`.
                API_URL: https://${API_DOMAIN}
        container_name: aventurette-app
        expose:
            - '80'
        restart: unless-stopped

    # The back office, a Vue SPA served by its own nginx (frontend/admin/nginx.conf owns the
    # history-mode fallback).
    admin:
        build:
            context: .. # the repository root: the app depends on frontend/packages/ and on
            # backend/scripts/aliases.mjs
            dockerfile: frontend/admin/Dockerfile
            args:
                # Vite inlines this into the JS bundle, so it is a build input, not a runtime
                # one: changing the domain needs `docker compose up -d --build admin`.
                VITE_API_URL: https://${API_DOMAIN}
        container_name: aventurette-admin
        expose:
            - '80'
        restart: unless-stopped

    # PocketBase, compiled from backend/api/. pb_data holds the database, the uploaded files and the
    # instance settings — it is the only state on the host, so it is the only thing to back up.
    api:
        build:
            context: ./api
        container_name: aventurette-api
        expose:
            - '8090'
        volumes:
            - ./api/pb_data:/app/pb_data
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/api/health']
            interval: 10s
            timeout: 3s
            retries: 10
            start_period: 15s
        restart: unless-stopped

    # Renewal only, every 12h. The first certificate is issued by scripts/init-certificate.sh.
    certbot:
        image: certbot/certbot
        container_name: aventurette-certbot
        volumes:
            - ./nginx/certbot/www:/var/www/certbot
            - ./nginx/certbot/conf:/etc/letsencrypt
        entrypoint: >
            sh -c "trap exit TERM;
                   while :; do
                     certbot renew --webroot --webroot-path=/var/www/certbot;
                     sleep 12h & wait $${!};
                   done"
        restart: unless-stopped
