# Serves the built SPA inside the front image.
# TLS and the API proxy are handled by the separate nginx service (see nginx/conf.d/).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses history mode, so any unknown path has to return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
